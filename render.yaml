services:
  - type: web
    name: adshooter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # workers ต้องเป็น 1 เท่านั้น ห้ามแก้เพิ่ม — automation.py มี background thread + เก็บข้อมูลเป็นไฟล์ JSON
    # ถ้ามีหลาย worker process จะมี automation loop วิ่งซ้อนกันหลายชุดและเขียนไฟล์ชนกันได้
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # เก็บข้อมูล (credentials/campaigns/conversations/automation) ถาวรในฐานข้อมูล Postgres (เช่น Supabase)
      # แทนดิสก์ของ Render (แพลนฟรีไม่มีดิสก์ถาวร) — ต้องตั้งค่านี้ ไม่งั้นข้อมูลหายตอน redeploy/restart
      - key: DATABASE_URL
        sync: false
